syntax = "proto3";

package manager.api.menu;

import "api/menu/proto/menu.proto";
import "google/api/annotations.proto";

option go_package = "manager/api/menu;menu";
option java_multiple_files = true;
option java_package = "manager.api.menu";

service Menu {
  // ListMenu 获取菜单信息列表
  rpc ListCurrentMenu(ListCurrentMenuRequest) returns (ListMenuReply) {
    option (google.api.http) = {get: "/manager/api/current/menus"};
  }

  // ListMenu 获取菜单信息列表
  rpc ListMenu(ListMenuRequest) returns (ListMenuReply) {
    option (google.api.http) = {get: "/manager/api/menus"};
  }

  // CreateMenu 创建菜单信息
  rpc CreateMenu(CreateMenuRequest) returns (CreateMenuReply) {
    option (google.api.http) = {
      post: "/manager/api/menu"
      body: "*"
    };
  }

  // UpdateMenu 更新菜单信息
  rpc UpdateMenu(UpdateMenuRequest) returns (UpdateMenuReply) {
    option (google.api.http) = {
      put: "/manager/api/menu"
      body: "*"
    };
  }

  // DeleteMenu 删除菜单信息
  rpc DeleteMenu(DeleteMenuRequest) returns (DeleteMenuReply) {
    option (google.api.http) = {delete: "/manager/api/menu"};
  }

  // RegisterMenu 注册应用菜单（供各服务启动时自注册菜单/接口权限）
  rpc RegisterMenu(RegisterMenuRequest) returns (RegisterMenuReply) {
    option (google.api.http) = {
      post: "/manager/api/menu/register"
      body: "*"
    };
  }
}
