syntax = "proto3";

package manager.api.scope;

import "validate/validate.proto";

option go_package = "manager/api/scope;scope";
option java_multiple_files = true;
option java_package = "manager.api.scope.proto";

message GetScopeRequest {
  string database = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
  string model = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
  string method = 3 [(validate.rules).string = {min_len: 1, max_len: 64}];
}

message GetScopeReply {
  bool allDept = 1;
  repeated uint32 deptScopes = 2;
  string rule = 3;
  uint32 userId = 5;
  uint32 deptId = 6;
}

message GetUserDeptIdRequest {
  uint32 userId = 1 [(validate.rules).uint32 = {gte: 1}];
}
message GetUserDeptIdReply {
  uint32 deptId = 1;
}
