syntax = "proto3";

package manager.api.field;

import "api/field/proto/field.proto";
import "google/api/annotations.proto";

option go_package = "github.com/limes-cloud/manager/api/field;field";
option java_multiple_files = true;
option java_package = "manager.api.field";

service Field {
  // ListFieldOptions 获取组件类型和校验规则枚举
  rpc ListFieldOptions(ListFieldOptionsRequest) returns (ListFieldOptionsReply) {
    option (google.api.http) = {get: "/manager/api/field/options"};
  }

  // ListField 获取字段列表
  rpc ListField(ListFieldRequest) returns (ListFieldReply) {
    option (google.api.http) = {get: "/manager/api/fields"};
  }

  // CreateField 创建字段
  rpc CreateField(CreateFieldRequest) returns (CreateFieldReply) {
    option (google.api.http) = {
      post: "/manager/api/field"
      body: "*"
    };
  }

  // UpdateField 更新字段
  rpc UpdateField(UpdateFieldRequest) returns (UpdateFieldReply) {
    option (google.api.http) = {
      put: "/manager/api/field"
      body: "*"
    };
  }

  // DeleteField 删除字段
  rpc DeleteField(DeleteFieldRequest) returns (DeleteFieldReply) {
    option (google.api.http) = {delete: "/manager/api/field"};
  }
}
