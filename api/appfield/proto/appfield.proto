syntax = "proto3";

package manager.api.appfield;

import "api/field/proto/field.proto";
import "validate/validate.proto";

option go_package = "manager/api/appfield;appfield";
option java_multiple_files = true;
option java_package = "manager.api.appfield";

message ListAppFieldRequest {
  uint32 page = 1 [(validate.rules).uint32 = {gte: 1}];
  uint32 pageSize = 2 [(validate.rules).uint32 = {gte: 1, lte: 50}];
  optional string order = 3 [(validate.rules).string = {in: ["asc", "desc"]}];
  optional string orderBy = 4 [(validate.rules).string = {in: ["id", "sort", "created_at"]}];
  optional string keyword = 5;
  optional string name = 6;
  string app = 7 [(validate.rules).string = {min_len: 1, max_len: 64}];
}

message ListAppFieldReply {
  message Field {
    uint32 id = 1;
    string keyword = 2;
    string type = 3;
    string name = 4;
    optional manager.api.field.FieldConfig config = 5;
    optional string description = 6;
  }

  message Data {
    uint32 id = 1;
    string app = 2;
    uint32 fieldId = 3;
    bool required = 4;
    bool unique = 5;
    uint32 sort = 6;
    uint32 createdAt = 7;
    uint32 updatedAt = 8;
    Field field = 9;
  }

  uint32 total = 1;
  repeated Data list = 2;
}

message CreateAppFieldRequest {
  string app = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
  uint32 fieldId = 2 [(validate.rules).uint32 = {gte: 1}];
  bool required = 3;
  bool unique = 4;
  uint32 sort = 5;
}

message CreateAppFieldReply {
  uint32 id = 1;
}

message UpdateAppFieldRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gt: 0}];
  bool required = 2;
  bool unique = 3;
  uint32 sort = 4;
}

message UpdateAppFieldReply {}

message DeleteAppFieldRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gt: 0}];
}

message DeleteAppFieldReply {}
