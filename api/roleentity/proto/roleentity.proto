syntax = "proto3";

package manager.api.roleentity;

import "validate/validate.proto";

option go_package = "manager/api/roleentity;roleentity";
option java_multiple_files = true;
option java_package = "manager.api.roleentity";

message CreateRoleEntityRequest {
  uint32 roleId = 1 [(validate.rules).uint32 = {gte: 1}];
  uint32 entityId = 2 [(validate.rules).uint32 = {gte: 1}];
  // 单条模式必填；items 批量模式忽略，故用 optional 避免空串触发 min_len 校验
  optional string action = 3 [(validate.rules).string = {min_len: 1}];
  optional string scope = 4 [(validate.rules).string = {min_len: 1}];
  repeated uint32 rules = 6;
  repeated uint32 depts = 7;
  optional string app = 8 [(validate.rules).string = {max_len: 64}];
  // items 批量配置：非空时按 items 逐条创建（action/scope 各自独立），忽略上方 action/scope/rules/depts 单条字段
  repeated RoleEntityItem items = 9;
}

// RoleEntityItem 批量配置项：一个操作类型的完整权限配置
message RoleEntityItem {
  string action = 1 [(validate.rules).string = {min_len: 1}];
  string scope = 2 [(validate.rules).string = {min_len: 1}];
  repeated uint32 depts = 3;
  repeated uint32 rules = 4;
}

message CreateRoleEntityReply {
  uint32 id = 1;
}

message ListRoleEntityRequest {
  uint32 page = 1 [(validate.rules).uint32 = {gte: 1}];
  uint32 pageSize = 2 [(validate.rules).uint32 = {
    gte: 1
    lte: 50
  }];
  uint32 roleId = 3 [(validate.rules).uint32 = {gte: 1}];
  optional uint32 entityId = 4 [(validate.rules).uint32 = {gte: 1}];
  optional string app = 5 [(validate.rules).string = {max_len: 64}];
}

message ListRoleEntityReply {
  message App {
    uint32 id = 1;
    string name = 2;
  }
  message Entity {
    uint32 id = 1;
    string name = 2;
    string comment = 3;
    App app = 4;
  }
  message Data {
    uint32 id = 1;
    uint32 roleId = 2;
    uint32 entityId = 3;
    string action = 4;
    string scope = 5;
    repeated uint32 rules = 7;
    repeated uint32 depts = 9;
    uint32 createdAt = 10;
    uint32 updatedAt = 11;
    Entity entity = 12;
  }
  repeated Data list = 1;
  uint32 total = 2;
}

// 更新时不允许修改操作类型（action 在创建后不可变），故请求中不收 action 字段
message UpdateRoleEntityRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gte: 1}];
  optional uint32 roleId = 2 [(validate.rules).uint32 = {gte: 1}];
  optional uint32 entityId = 3 [(validate.rules).uint32 = {gte: 1}];
  optional string scope = 5 [(validate.rules).string = {min_len: 1}];
  repeated uint32 rules = 7;
  repeated uint32 depts = 8;
  optional string app = 9 [(validate.rules).string = {max_len: 64}];
}

message UpdateRoleEntityReply {}

message DeleteRoleEntityRequest {
  uint32 id = 1 [(validate.rules).uint32 = {gte: 1}];
}

message DeleteRoleEntityReply {}
